name: CI

on:
  push:
    branches:
      - main
      - 'backend/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (node:test)
        run: npm test

      - name: Generate Next route types
        run: npx next typegen

      - name: Run typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run production build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy_service_role_key_for_ci_build
          SUPABASE_ANON_KEY: dummy_anon_key_for_ci_build
        run: npm run build
